* { box-sizing: border-box; }

.panel { margin-bottom: 16px; padding: 20px; color: rgb(0, 0, 0); background: rgba(255, 255, 255, 0.94); border: 1px solid rgb(185, 208, 239); border-radius: 2px; box-shadow: none; }

.image-tools { position: fixed; z-index: 90; display: none; gap: 6px; flex-wrap: wrap; align-items: center; max-width: min(560px, -24px + 100vw); padding: 10px; background: rgb(17, 17, 17); color: rgb(255, 255, 255); border-radius: 14px; box-shadow: rgba(0, 0, 0, 0.34) 0px 14px 34px; }

.editor img:active { cursor: grabbing; }

.size-control { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.size-control input[type="range"] { width: 150px; padding: 0px; }
.crop-modal { position: fixed; inset: 0px; z-index: 100; background: rgba(0, 0, 0, 0.72); display: flex; align-items: center; justify-content: center; padding: 20px; }
.crop-box { width: min(920px, 96vw); max-height: 94vh; overflow: auto; background: rgb(255, 255, 255); border-radius: 18px; padding: 18px; }
.crop-stage { position: relative; display: inline-block; max-width: 100%; background: rgb(17, 17, 17); overflow: hidden; }

 <script>
 (function(){
   function mwbFitExactLivePreview(){
     var vw=Math.max(document.documentElement.clientWidth||0,window.innerWidth||0);
     var vh=Math.max(document.documentElement.clientHeight||0,window.innerHeight||0);
     // Cover the real phone viewport. This preserves the Live Preview proportions
     // while guaranteeing there is no undersized/letterboxed app surface.
     var scale=Math.max(vw/375,vh/812);
     document.documentElement.style.setProperty("--mwb-device-scale",String(scale||1));
     document.documentElement.style.setProperty("--mwb-device-width",vw+"px");
     document.documentElement.style.setProperty("--mwb-device-height",vh+"px");
     var root=document.querySelector(".mwbPv");
     if(root){
       root.style.setProperty("width","375px","important");
       root.style.setProperty("height","812px","important");
       root.style.setProperty("min-height","812px","important");
       root.style.setProperty("transform-origin","top center","important");
       root.style.setProperty("transform","scale("+String(scale||1)+")","important");
       root.style.setProperty("left","50%","important");
       root.style.setProperty("margin-left","-187.5px","important");
     }
   }
   mwbFitExactLivePreview();
   window.addEventListener("resize",mwbFitExactLivePreview);
   var shell=document.querySelector(".mwbPv")||document.body;

   // APP HOME means this published app shell, never website/project index.
   function showAppHome(){
     document.querySelectorAll(".appLayer").forEach(function(layer){layer.remove()});
   }

   function pageUrl(id){
     var key=String(id||"index").trim()||"index";
     var url=String("https://ceconremodelingllc.com"||"").trim();
     try{
       if(!url)return "";
       var u=new URL(url);
       u.searchParams.set("mwbApp","1");
       if(key==="index")u.searchParams.delete("page");
       else u.searchParams.set("page",key);
       return u.toString();
     }catch(e){return url}
   }

   function openApp(id){
     var key=String(id||"").trim();
     if(!key||key==="app-home"){showAppHome();return}
     document.querySelectorAll(".appLayer").forEach(function(layer){layer.remove()});
     var layer=document.createElement("div");
     layer.className="appLayer";
     var frame=document.createElement("iframe");
     frame.src=pageUrl(key);
 frame.addEventListener("load",function(){
   try{
     var d=frame.contentDocument||frame.contentWindow.document;
     if(d){
       var st=d.createElement("style");
       st.id="mwb-native-app-hide-site-nav";
       st.textContent="header,nav,.top-nav,.topnav,.top-navigation,.site-header,.site-nav,.navbar,.navigation,.main-navigation,#topNav,#topNavigation,#siteHeader,#siteNav,#navbar,#navigation,[data-site-navigation],[data-top-navigation]{display:none!important;height:0!important;min-height:0!important;max-height:0!important;margin:0!important;padding:0!important;border:0!important;overflow:hidden!important}body{padding-top:0!important;margin-top:0!important}";
       (d.head||d.documentElement).appendChild(st);
       d.documentElement.classList.add("mwb-native-app-page");
       d.body&&d.body.classList.add("mwb-native-app-page");
     }
   }catch(e){}
   try{frame.contentWindow.postMessage({type:"mwb-native-app",hideTopNavigation:true},"*")}catch(e){}
 });
     frame.setAttribute("title",key);
     var back=document.createElement("button");
     back.type="button";
     back.className="appBack";
     back.setAttribute("aria-label","Back to app home");
     back.textContent="‹";
     back.addEventListener("click",function(event){
       event.preventDefault();event.stopPropagation();
       showAppHome();
     });
     layer.appendChild(frame);layer.appendChild(back);shell.appendChild(layer);
   }

   document.addEventListener("click",function(event){
     var item=event.target.closest("[data-app]");
     if(!item)return;
     event.preventDefault();event.stopPropagation();
     openApp(item.getAttribute("data-app"));
   },true);

   // Any back request emitted by an embedded app page returns to APP HOME.
   window.addEventListener("message",function(event){
     var data=event.data||{};
     if(data==="mwb-app-home"||data.type==="mwb-app-home"||data.action==="back-to-app-home")showAppHome();
   });

   // Hardware/browser back while a child page is open also returns to app home.
   window.addEventListener("popstate",function(){showAppHome()});
   window.mwbShowAppHome=showAppHome;
 })();
 </script></body></html>
