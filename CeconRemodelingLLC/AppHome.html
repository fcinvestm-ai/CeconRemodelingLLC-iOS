 <script>
 (function(){
   var shell=document.querySelector(".mwbPv")||document.body;

   // APP HOME means this published app shell, never website/project index.
   function showAppHome(){
     document.querySelectorAll(".appLayer").forEach(function(layer){layer.remove()});
   }

   function pageUrl(id){
     var key=String(id||"index").trim()||"index";
     var url=String("https://ceconremodelingllc.com"||"").trim();
     try{
       if(!url)return "";
       var u=new URL(url);
       u.searchParams.set("mwbApp","1");
       if(key==="index")u.searchParams.delete("page");
       else u.searchParams.set("page",key);
       return u.toString();
     }catch(e){return url}
   }

   function openApp(id){
     var key=String(id||"").trim();
     if(!key||key==="app-home"){showAppHome();return}
     document.querySelectorAll(".appLayer").forEach(function(layer){layer.remove()});
     var layer=document.createElement("div");
     layer.className="appLayer";
     var frame=document.createElement("iframe");
     frame.src=pageUrl(key);
 frame.addEventListener("load",function(){
   try{
     var d=frame.contentDocument||frame.contentWindow.document;
     if(d){
       var st=d.createElement("style");
       st.id="mwb-native-app-hide-site-nav";
       st.textContent="header,nav,.top-nav,.topnav,.top-navigation,.site-header,.site-nav,.navbar,.navigation,.main-navigation,#topNav,#topNavigation,#siteHeader,#siteNav,#navbar,#navigation,[data-site-navigation],[data-top-navigation]{display:none!important;height:0!important;min-height:0!important;max-height:0!important;margin:0!important;padding:0!important;border:0!important;overflow:hidden!important}body{padding-top:0!important;margin-top:0!important}";
       (d.head||d.documentElement).appendChild(st);
       d.documentElement.classList.add("mwb-native-app-page");
       d.body&&d.body.classList.add("mwb-native-app-page");
     }
   }catch(e){}
   try{frame.contentWindow.postMessage({type:"mwb-native-app",hideTopNavigation:true},"*")}catch(e){}
 });
     frame.setAttribute("title",key);
     var back=document.createElement("button");
     back.type="button";
     back.className="appBack";
     back.setAttribute("aria-label","Back to app home");
     back.textContent="‹";
     back.addEventListener("click",function(event){
       event.preventDefault();event.stopPropagation();
       showAppHome();
     });
     layer.appendChild(frame);layer.appendChild(back);shell.appendChild(layer);
   }

   document.addEventListener("click",function(event){
     var item=event.target.closest("[data-app]");
     if(!item)return;
     event.preventDefault();event.stopPropagation();
     openApp(item.getAttribute("data-app"));
   },true);

   // Any back request emitted by an embedded app page returns to APP HOME.
   window.addEventListener("message",function(event){
     var data=event.data||{};
     if(data==="mwb-app-home"||data.type==="mwb-app-home"||data.action==="back-to-app-home")showAppHome();
   });

   // Hardware/browser back while a child page is open also returns to app home.
   window.addEventListener("popstate",function(){showAppHome()});
   window.mwbShowAppHome=showAppHome;
 })();
